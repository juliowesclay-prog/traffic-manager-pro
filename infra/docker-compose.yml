# Serviços locais de desenvolvimento do Traffic Manager Pro. NÃO usar em homologação/produção.
name: traffic-manager-pro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (rode pnpm env:init)}
      POSTGRES_DB: ${POSTGRES_DB:-traffic_manager_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tmp} -d ${POSTGRES_DB:-traffic_manager_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
